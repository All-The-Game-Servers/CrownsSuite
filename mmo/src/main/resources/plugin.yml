name: CrownsMMO
version: 1.7.0
main: com.xkstudios.crowns.CrownsPlugin
api-version: "1.21"
authors: [XKStudios]
depend: [CrownsAPI]
softdepend: [CrownsEconomy, CrownsEvents, CrownsAdmin, CrownsDrugs]
description: SAO-inspired MMO progression, professions, combat, and world progression for Crowns Suite.
commands:
  crownsmmo:
    description: Crowns MMO commands
    usage: /<command> [party|guild|skills|professions|combat|world|floors|floor|quests|quest|boss|resources|gear|recipes|actives|admin]
    aliases: [cmmo]
permissions:
  crowns.use:
    default: true
  crowns.mmo.admin:
    description: Allows CrownsMMO floor setup and manual floor unlocks.
    default: op
