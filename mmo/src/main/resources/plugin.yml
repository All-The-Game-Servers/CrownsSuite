name: CrownsMMO
version: 1.2.0
main: com.xkstudios.crowns.CrownsPlugin
api-version: "1.21"
authors: [XKStudios]
depend: [CrownsAPI]
softdepend: [CrownsEconomy, CrownsEvents, CrownsAdmin, CrownsDrugs]
description: SAO-inspired MMO progression, professions, combat, and world progression for Crowns Suite.
commands:
  crownsmmo:
    description: Crowns MMO commands
    usage: /<command>
    aliases: [cmmo]
permissions:
  crowns.use:
    default: true
