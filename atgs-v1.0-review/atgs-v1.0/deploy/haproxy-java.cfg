# ATGS relay cluster — HAProxy L4 config
#
# Sticky-by-SNI hostname consistent hash. Every Java Edition client will
# reach the same relay for the same `server.atgslowlightsmp.mine.bz`
# hostname even as relays are added or removed from the pool.
#
# Phase 8: add/remove relays by editing the `backend atgs_relays` server list
# and running `systemctl reload haproxy`. Consistent hashing preserves most
# existing sessions; only the minimum number of flows reshuffle.
#
# TLS: HAProxy operates pure L4 (mode tcp). SNI is read from the ClientHello
# WITHOUT terminating TLS. Relays handle TLS themselves. This preserves
# Minecraft's protocol integrity and lets us upgrade TLS independently of LB.

global
    log stdout format raw local0
    maxconn 50000
    nbthread 4
    # No TLS work here; raise the ulimit to handle concurrent games.
    tune.ssl.default-dh-param 2048

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    timeout connect 5s
    timeout client  300s     # Minecraft clients can idle briefly
    timeout server  300s
    timeout tunnel  24h      # a Minecraft session IS the tunnel

# --- Java Edition (TCP, port 25565) ---
frontend atgs_java
    bind :25565
    # Inspect ClientHello for SNI without terminating
    tcp-request inspect-delay 5s
    tcp-request content accept if { req_ssl_hello_type 1 }
    default_backend atgs_relays_java

backend atgs_relays_java
    balance hdr(host)
    hash-type consistent
    # req_ssl_sni works post-inspect; hdr(host) is a fallback when the client
    # uses the legacy handshake that lacks SNI. Hash on whichever is present.
    stick-table type string len 64 size 50k expire 24h
    stick on req_ssl_sni
    option tcp-check
    tcp-check connect port 8082
    tcp-check send "GET /health HTTP/1.0\r\n\r\n"
    tcp-check expect rstring "ok"

    # Add one line per relay instance. The port here is the relay's INGRESS
    # port (where it accepts TCP from players), not its health port.
    server relay-1 relay-1.internal:25565 check port 8082 inter 5s fall 3 rise 2
    server relay-2 relay-2.internal:25565 check port 8082 inter 5s fall 3 rise 2
    server relay-3 relay-3.internal:25565 check port 8082 inter 5s fall 3 rise 2

# --- Bedrock (UDP, port 19132) ---
# HAProxy 2.4+ has experimental UDP support via `mode udp`; for production
# we recommend a purpose-built UDP LB (nftables hash + keepalived, or cloud
# LB like AWS NLB). The Phase 8 Bedrock relay expects RakNet traffic directly
# anyway, so the LB just needs to preserve source-IP so the relay can build
# session state.
#
# See deploy/bedrock-lb-nftables.conf for the UDP side.

# --- Operational notes ---
# 1. Relay health port is 8082 by default. Check /health returns "ok" when
#    the relay has an active routing subscription to Central.
# 2. Stickiness is consistent-hash-by-SNI: scaling the pool reshuffles only
#    1/N of flows. Acceptable for Minecraft.
# 3. `timeout tunnel 24h` is deliberate — Minecraft flows are long-lived.
#    Any lower risks dropping active players during quiet periods.
