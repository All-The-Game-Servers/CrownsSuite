name: CrownsTerrain
version: 1.8.1
main: com.xkstudios.crowns.terrain.CrownsTerrainPlugin
api-version: "1.21"
authors: [XKStudios]
depend: [CrownsAPI]
softdepend: [CrownsEvents]
loadbefore: [CrownsMMO]
description: Hybrid route-first floor engine with runtime readiness and custom structure pipeline support.
commands:
  crownsterrain:
    description: Crowns Terrain commands
    usage: /<command> [info|preview|villages|admin]
    aliases: [cterrain]
permissions:
  crowns.terrain.use:
    description: Allows opening CrownsTerrain information pages.
    default: true
  crowns.terrain.admin:
    description: Allows CrownsTerrain admin generation, locate, teleport, and reload commands.
    default: op
