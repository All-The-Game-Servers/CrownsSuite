name: CrownsTerrain
version: 1.8.5
main: com.xkstudios.crowns.terrain.CrownsTerrainPlugin
api-version: "1.21"
authors: [XKStudios]
depend: [CrownsAPI]
softdepend: [CrownsEvents]
loadbefore: [CrownsMMO]
description: WorldPainter macro terrain pipeline with Blender-authored Floor 1 kit, pregeneration overlays, and Structure Studio support.
commands:
  crownsterrain:
    description: Crowns Terrain commands
    usage: /<command> [info|preview|villages|admin]
    aliases: [cterrain]
permissions:
  crowns.terrain.use:
    description: Allows opening CrownsTerrain information pages.
    default: true
  crowns.terrain.admin:
    description: Allows CrownsTerrain admin generation, locate, teleport, reload, and Structure Studio commands.
    default: op
