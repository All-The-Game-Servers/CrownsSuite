name: CrownsTerrain
version: 1.5.0
main: com.xkstudios.crowns.terrain.CrownsTerrainPlugin
api-version: "1.21"
authors: [XKStudios]
depend: [CrownsAPI]
softdepend: [CrownsEvents]
loadbefore: [CrownsMMO]
description: Reference-guided Floor 1 worldgen, anchored towns, districts, roads, hydrology, landmarks, and arenas for Crowns Suite.
commands:
  crownsterrain:
    description: Crowns Terrain commands
    usage: /<command> [info|preview|villages|admin]
    aliases: [cterrain]
permissions:
  crowns.terrain.use:
    description: Allows opening CrownsTerrain information pages.
    default: true
  crowns.terrain.admin:
    description: Allows CrownsTerrain admin locate and reload commands.
    default: op
