          first-haven: "Town spawn and civic center."
          market-square: "Main civic plaza and trader street."
          farm-gate: "Farm district entrance."
          starter-camp: "First wilderness camp."
          starter-shrine: "Early quest shrine."
          first-waystone: "Town travel marker."
          north-road: "Outbound starter route."
