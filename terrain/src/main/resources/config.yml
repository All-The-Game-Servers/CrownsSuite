terrain:
  enabled: true
  affect-all-floors: true
  showcase-floor: 2
  floor-1-world: crowns_floor_1_wp_slice
  generated-world-prefix: crowns_floor_
  persist-layout-points: true
  floor-1-livable: true
  defaults:
    floor-1-world-size: 2048
    generated-floor-world-size: 8000
    village-radius: 56
    arena-radius: 72
    spawn-safe-radius: 192
    structure-density: 1.0
    placement-mode: worldpainter-plus-ctpl
  floors:
    1:
      theme: First Haven
      palette: haven
      world: crowns_floor_1_wp_slice
      source-mode: worldpainter-plus-ctpl
      generation-mode: worldpainter-plus-ctpl
      terrain-profile: first_haven_worldpainter_slice
      blueprint-version: first_haven_worldpainter_v1
      fresh-world-required: true
      world-size: 2048
      structure-density: 1.25
      enabled-structures: [village, camp, landmark, waystone, road_marker, shrine, arena]
      worldpainter:
        enabled: true
        slice-size: 2048
        world-name: crowns_floor_1_wp_slice
        workspace: D:\CrownsSuiteTools\Projects\CrownsTerrain\WorldPainter\Floor1Slice
        require-exported-world: true
        auto-install-on-generate: true
        install-source-folder: D:\CrownsSuiteTools\Projects\CrownsTerrain\WorldPainter\ExportsTest2\crowns_floor_1_wp_slice
        bundled-resource: ''
        masks:
          heightmap: floor1-heightmap.png
          biomes: floor1-biomes.png
          rivers: floor1-rivers.png
          roads: floor1-roads.png
          settlement: floor1-settlement-mask.png
          landmarks: floor1-landmarks.png
          composite: floor1-composite-preview.png
      vanilla:
        caves: true
        mobs: true
        structures: false
        decorations: false
      artifacts:
        storage: binary-with-json-sidecars
        write-index: true
        write-scores: true
      debug-maps:
        enabled: true
        size: 512
      pregeneration:
        mode: critical-route-first
        chunks-per-tick: 12
        block-ops-per-tick: 3500
      engine-passes:
        macro-terrain: true
        biome-paint: true
        hydrology: true
        road-network: true
        structure-placement: true
        decoration: true
      first-haven:
        scale: large-town
        target-structures: 20
        style: high-fantasy-mmo
        asset-kit: blender-floor1-kit-v1
      road-network:
        hub: first-haven
        connect-villages: true
        connect-living-points: true
        connect-arena: true
        lamps: true
        slope-supports: true
      qa:
        strict: true
        minimum-qa-score: 0.70
        minimum-town-structures: 20
        require-road-network: true
        require-hydrology: true
        require-arena: true
        require-hero-landmark: true
        thresholds:
          average-road-slope: 0.85
          max-road-slope: 2.40
          minimum-qa-score: 0.70
          minimum-walkability-score: 0.70
          minimum-route-continuity-score: 0.85
          minimum-landmark-spacing-score: 0.70
          minimum-parcel-validity-score: 0.75
          minimum-biome-samples: 5
          minimum-parcels: 7
          minimum-decorations: 40
      blueprint-sets:
        first-haven-civic: [fh_spawn_plaza_grand, fh_town_hall_grand, fh_waystone_platform, notice_board, fh_shrine_grove]
        first-haven-residential: [fh_house_large_a, fh_house_large_b, fh_house_row, retaining_wall, switchback_stair]
        first-haven-market: [fh_market_street, fh_market_hall, fh_blacksmith_large]
        first-haven-farming: [fh_farm_terrace_stamp, fh_barn_large, fh_bridge_stream, farm_plot]
        first-haven-defensive: [fh_gatehouse_grand, fh_watchtower_tall, wall_fragment]
        wilderness: [fh_starter_camp, fh_cliff_rocks, road_marker, fh_shrine_grove, fh_bridge_stream]
        route-stamps: [fh_road_straight, fh_road_curve, fh_bridge_stream, fh_arena_approach]
        arena: [fh_first_gate_platform, fh_arena_approach, arena_staging, arena_threshold]
      set-map:
        points:
          first-haven: "Town spawn and civic center."
          market-square: "Main civic plaza and trader street."
          farm-gate: "Farm district entrance."
          starter-camp: "First wilderness camp."
          starter-shrine: "Early quest shrine."
          first-waystone: "Town travel marker."
          north-road: "Outbound starter route."
          arena-approach: "First Gate staging road."
          first-gate-arena: "Floor 1 boss arena."
        zones:
          civic-core: "Large plaza, town hall, guild hall, and waystone."
          residential-ring: "Larger authored houses around the civic core."
          market-street: "Market stalls and public trade route."
          farming-edge: "Terraced farms and barn."
          defensive-gate: "Gatehouse, tower, and wall edge."
          wilderness-route: "Road to camp, shrine, and arena."
        required-structures:
          - fh_town_hall_grand
          - fh_spawn_plaza_grand
          - fh_market_street
          - fh_farm_terrace_stamp
          - fh_starter_camp
          - fh_shrine_grove
          - fh_waystone_platform
          - fh_first_gate_platform
          - fh_arena_approach
      regions:
        meadow-basin: "Starter meadow around First Haven with broad building space and safe travel."
        oak-highlands: "Rolling oak hills with rocks, groves, and overlook paths."
        river-valley: "Lower water-carved valleys with ponds, mud banks, and route breaks."
        starter-forest: "Dense but readable forest for wood, camps, and early exploration."
        farmland-flats: "Open farming land and small homestead routes."
        shrine-ridge: "Higher mossy ridge for shrines and landmark silhouettes."
        gate-wilds: "Rugged approach region around the First Gate arena."
      structure-sets:
        towns: true
        camps: true
        landmarks: true
        roads: true
        trees: true
        rocks: true
        ruins: true
        arena: true
      structure-density-controls:
        towns: 1.0
        camps: 1.0
        landmarks: 1.0
        roads: 1.0
        trees: 1.25
        rocks: 0.85
        ruins: 0.8
        arena: 1.0
      anchors:
        market-square:
          district: civic
          template: town_hall
        bridgehead-gate:
          district: defensive_edge
          template: gatehouse
        farm-terraces:
          district: farming
          template: terraced_farm
        mill-creek:
          district: road_edge
          template: mill
      districts:
        civic: "Spawn plaza, town hall, notice board, waystone, and central square."
        residential: "Hillside homes, retaining walls, paths, and overlooks."
        market: "Market stalls and road-facing trade spaces."
        farming: "Terraced farms, mill creek, water access, and useful starter crops."
        road_edge: "Road markers, bridges, lamps, camps, and switchbacks."
        defensive_edge: "Gatehouse, watchtower, walls, and safe town threshold."
        wilderness_edge: "Hero trees, groves, roots, ruins, and transition clutter."
      tree-pools:
        canopy: [oak, large_oak]
        edge: [oak, azalea]
        understory: [fern, mushroom, moss]
        roots-and-stumps: [oak_log, stripped_oak_log, rooted_dirt]
        fallen-logs: [oak_log]
        hero-trees: [ancient_oak]
      road-rules:
        slope-aware: true
        max-comfort-grade: 4
        supports-on-steep-grade: true
        lamps: true
        switchbacks: true
      hydrology:
        streams: true
        ponds: true
        mud-banks: true
        bridge-crossings: true
      landmark-rarity:
        hero-tree: rare
        spire: uncommon
        ruin: uncommon
        vista: rare
