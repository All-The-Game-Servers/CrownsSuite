moderation:
  enabled: true
  reports:
    enabled: true
  role-chat-badges: true
  staff-mode:
    enabled: true
  freeze:
    blocked-commands:
      - /spawn
      - /home
      - /warp
  mute:
    default-durations:
      - 10m
      - 1h
      - 1d
  ban:
    default-durations:
      - 1d
      - 7d
      - 30d
      - permanent
  inventory-snapshots:
    max-per-player: 20
  puppeteer:
    enabled: true
  vanish:
    enabled: true
    silent-join-quit: true
    staff-can-see-vanished: true
    hide-from-tab: true
    fake-presence-messages: true

analytics:
  playtime:
    snapshot-interval-minutes: 5
  economy:
    enabled: true
    retention-days: 90
    prune-interval-hours: 12

entity-management:
  sweeper:
    enabled: true
    interval-minutes: 5
