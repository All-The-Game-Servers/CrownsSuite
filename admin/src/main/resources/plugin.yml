name: CrownsAdmin
version: 1.3.0
main: com.xkstudios.crowns.CrownsPlugin
api-version: "1.21"
authors: [XKStudios]
depend: [CrownsAPI]
softdepend: [CrownsEconomy]
description: Moderation, analytics, and staff utilities for Crowns Suite.
commands:
  crownsadmin:
    description: Crowns admin commands
    usage: /<command>
    aliases: [ca]
permissions:
  crowns.mod:
    default: op
  crowns.mod.inspect:
    default: op
  crowns.mod.punish:
    default: op
  crowns.mod.freeze:
    default: op
  crowns.mod.staffmode:
    default: op
  crowns.mod.vanish:
    default: op
  crowns.mod.puppet:
    default: op
  crowns.mod.reports:
    default: op
  crowns.mod.rollback:
    default: op
  crowns.mod.roles:
    default: op
