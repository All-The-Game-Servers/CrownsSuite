name: CrownsAPI
version: 0.1.2
main: com.xkstudios.crowns.api.CrownsAPIPlugin
api-version: "1.21"
load: STARTUP
authors: [XKStudios]
description: Shared API, data, GUI, input, and service registry for Crowns plugins.
commands:
  capi:
    description: CrownsAPI utility and resource-pack command.
    usage: /capi [pack|gui|status|modules|downloads|help]
    aliases: [crownsapi]
permissions:
  crowns.api.admin:
    description: Allows refreshing and applying the required Crowns Suite resource pack.
    default: op
