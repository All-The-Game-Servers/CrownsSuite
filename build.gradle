ext.crownsModuleVersions = [
        api   : '0.1.4',
        magic : '0.3.0',
        swords: '0.3.1'
]

ext.crownsJarNames = [
        api   : 'CrownsAPI',
        magic : 'CrownsMagic',
        swords: 'CrownsSwords'
]

subprojects {
    apply plugin: 'java'

    group = 'com.xkstudios'
    version = rootProject.ext.crownsModuleVersions[name] ?: '1.4.0'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }

    dependencies {
        compileOnly 'io.papermc.paper:paper-api:26.1.2.build.+'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 25
    }

    processResources {
        filteringCharset = 'UTF-8'
    }

    tasks.named('jar') {
        archiveBaseName = rootProject.ext.crownsJarNames[name] ?: project.name
    }
}

tasks.register('cleanDownloads') {
    doLast {
        delete fileTree("${rootDir}/downloads") {
            include 'CrownsAPI-*.jar'
            include 'CrownsMagic-*.jar'
            include 'CrownsSwords-*.jar'
            include 'CrownsEconomy-*.jar'
            include 'CrownsAdmin-*.jar'
            include 'CrownsEvents-*.jar'
            include 'CrownsDrugs-*.jar'
            include 'CrownsMMO-*.jar'
            include 'CrownsTerrain-*.jar'
        }
    }
}

tasks.register('packageDownloads') {
    dependsOn 'cleanDownloads'
    dependsOn subprojects.collect { it.tasks.named('jar') }
    doLast {
        copy {
            from subprojects.collect { it.tasks.named('jar').get().archiveFile }
            into "${rootDir}/downloads"
        }
        println "Packaged current Crowns Suite jars into ${rootDir}/downloads"
    }
}
