        min-relics: 50
        min-blaze-kills: 3
        reward-money: 1500
        reward-item-key: voidwalker_boots
      chorus_weaver:
        display: Chorus Weaver
        description: "Harvest 8 chorus blooms and turn in 75 relic points."
        min-relics: 75
        min-ancient-debris: 8
        reward-money: 2200
        reward-item-key: gateway_lantern
      city_surveyor:
        display: City Surveyor
        description: "Turn in 125 relic points and claim 4 End survey caches."
        min-relics: 125
        min-cache-loot: 4
        reward-money: 3000
        reward-item-key: chorus_satchel
      top_collector:
