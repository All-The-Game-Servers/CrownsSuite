dimensions:
  nether-locked: true
  end-locked: true

events:
  enabled: true
  active-event: nether-opening

  item-safety:
    relic-fallback-material: AMETHYST_SHARD
    reward-fallback-material: FIREWORK_STAR
    blocked-materials:
      - NETHER_STAR
      - END_CRYSTAL
      - ELYTRA
      - SHULKER_SHELL
      - DRAGON_BREATH
      - DRAGON_EGG
      - ENDER_EYE
      - ENDER_PEARL
      - CHORUS_FRUIT
      - POPPED_CHORUS_FRUIT
      - BLAZE_ROD
      - GHAST_TEAR
      - NETHERITE_SCRAP
      - ANCIENT_DEBRIS

  nether-opening:
    enabled: true
    title: Nether Opening Week
    start-time: "2030-01-01 12:00"
    duration-days: 7
    dimension-lock:
      enabled: true
    broadcasts:
      public-milestones: true
      checkpoints-minutes: [60, 10, 1]

  end-opening:
    enabled: true
    title: Endfall Opening Week
    start-time: "2030-01-08 12:00"
    duration-days: 7
    dimension-lock:
      enabled: true
    broadcasts:
      public-milestones: true
      checkpoints-minutes: [1440, 60, 10, 1]
      checkpoint-1440: "Endfall begins in 24 hours. Prepare pearls, blocks, slow falling, and your expedition kits."
      checkpoint-60: "Endfall begins in 1 hour. The End portal will open soon."
      checkpoint-10: "Endfall begins in 10 minutes. Gather for the dragon ceremony."
      checkpoint-1: "Endfall begins in 1 minute. The void is waking."
      start:
        - "Endfall Opening Week has begun. The End is now open for Season 1."
        - "Defeat the dragon, push to the outer islands, recover void relics, and claim rewards with /events."
    guide:
      quick-start:
        - "1. Join the opening dragon ceremony at the End portal."
        - "2. Defeat the dragon, then push toward outer islands and End cities."
        - "3. Recover physical void relics, turn them in, and claim rewards."
      relics:
        - "Relics are physical event items dropped from Endfall activities."
        - "Relics only count after you turn them in with /events turnin hand or /events turnin all."
      progress:
        - "Personal progress comes from relic turn-ins, elite kills, chorus harvests, and survey caches."
        - "Server milestones unlock shared claim rewards as everyone turns in relics."
      ceremony:
        - "The dragon fight is the opening ceremony, not the whole event."
        - "Dragon Fall is recorded as a public live moment for Season 1 history."
      exploration:
        - "End cities, ships, barrels, and chests can become one-time survey caches."
        - "Outer-island exploration is the main long-tail Endfall loop."
      combat:
        - "Voidbound Endermen and Shulkers can spawn during the live event."
        - "Elite kills count toward Endfall combat rewards and can drop stronger relics."
      rewards:
        - "Open the Rewards page to see exact requirements."
        - "Ready rewards should always be claimable; locked rewards explain what is missing."
    relic-items:
      echo_shard:
        material: ECHO_SHARD
        display: Echo Shard
        description: "A humming splinter recovered from the first tears in the void."
        points: 1
        rarity: common
        model-path: "lowlight/end/echo_shard"
      shulker_sigil:
        material: END_ROD
        display: Shulker Sigil
        description: "A carved seal taken from shattered End watchposts."
        points: 2
        rarity: uncommon
        model-path: "lowlight/end/shulker_sigil"
      starchart_fragment:
        material: PAPER
        display: Starchart Fragment
        description: "A torn survey record pointing toward forgotten islands."
        points: 3
        rarity: uncommon
        model-path: "lowlight/end/starchart_fragment"
      void_core:
        material: AMETHYST_SHARD
        display: Void Core
        description: "A dense knot of End energy recovered from unstable gateways."
        points: 5
        rarity: rare
        model-path: "lowlight/end/void_core"
      crown_of_the_void:
        material: FIREWORK_STAR
        display: Crown Of The Void
        description: "A legendary fragment said to answer only to the deepest Endfall expeditions."
        points: 10
        rarity: legendary
        model-path: "lowlight/end/crown_of_the_void"
    craft-materials:
      void_filament:
        material: STRING
        display: Void Filament
        description: "A thin strand of End energy useful for expedition crafting."
        model-path: "lowlight/end/material/void_filament"
      chorus_weave:
        material: RABBIT_HIDE
        display: Chorus Weave
        description: "A stitched strip of chorus fiber prepared for specialty rewards."
        model-path: "lowlight/end/material/chorus_weave"
      gateway_residue:
        material: GLOW_INK_SAC
        display: Gateway Residue
        description: "A volatile residue scraped from unstable End gateways."
        model-path: "lowlight/end/material/gateway_residue"
    reward-items:
      starchart_compass:
        material: COMPASS
        display: Starchart Compass
        amount: 1
        unbreakable: true
        lore:
          - "A surveyor's compass issued for the first Endfall scouts."
        enchantments:
          UNBREAKING: 3
        model-path: "lowlight/end/reward/starchart_compass"
      voidwalker_boots:
        material: CHAINMAIL_BOOTS
        display: Voidwalker Boots
        amount: 1
        unbreakable: true
        lore:
          - "Boots tuned for long drops and fractured outer-island ledges."
        enchantments:
          FEATHER_FALLING: 4
          PROTECTION: 3
          UNBREAKING: 3
        model-path: "lowlight/end/reward/voidwalker_boots"
      gateway_lantern:
        material: SOUL_LANTERN
        display: Gateway Lantern
        amount: 1
        lore:
          - "A soft beacon for charting safe camps between broken islands."
        model-path: "lowlight/end/reward/gateway_lantern"
      chorus_satchel:
        material: BUNDLE
        display: Chorus Satchel
        amount: 1
        lore:
          - "A compact expedition satchel stitched for long-range End surveys."
        model-path: "lowlight/end/reward/chorus_satchel"
      crown_beyond_stars:
        material: CHAINMAIL_HELMET
        display: Crown Beyond Stars
        amount: 1
        unbreakable: true
        lore:
          - "A ceremonial helm awarded to the boldest Endfall pathfinders."
        enchantments:
          PROTECTION: 4
          UNBREAKING: 3
          MENDING: 1
        model-path: "lowlight/end/reward/crown_beyond_stars"
      endfall_trophy:
        material: FIREWORK_STAR
        display: Endfall Trophy
        amount: 1
        lore:
          - "A permanent Lowlight SMP keepsake from Endfall Opening Week."
          - "Awarded for finishing atop the End relic board."
        model-path: "lowlight/end/reward/endfall_trophy"
    milestones:
      signal_in_the_void:
        display: Signal In The Void
        target: 50
        announce: true
        reward-money: 500
        reward-item: END_ROD
        reward-item-amount: 8
      charted_shore:
        display: Charted Shore
        target: 150
        announce: true
        reward-money: 900
        reward-item: PURPUR_BLOCK
        reward-item-amount: 16
      chorus_spindle:
        display: Chorus Spindle
        target: 300
        announce: true
        reward-money: 1500
        reward-item: END_STONE_BRICKS
        reward-item-amount: 16
      city_lights:
        display: City Lights
        target: 500
        announce: true
        reward-money: 2200
        reward-item: ENDER_CHEST
        reward-item-amount: 1
      gateway_chain:
        display: Gateway Chain
        target: 750
        announce: true
        reward-money: 3200
        reward-item: CHORUS_FLOWER
        reward-item-amount: 8
      crown_beyond_stars:
        display: Crown Beyond Stars
        target: 1000
        announce: true
        reward-money: 5000
        reward-item-key: crown_beyond_stars
    rewards:
      starchart_scout:
        display: Starchart Scout
        description: "Turn in 10 relic points during Endfall Opening Week."
        min-relics: 10
        reward-money: 500
        reward-item-key: starchart_compass
      void_runner:
        display: Void Runner
