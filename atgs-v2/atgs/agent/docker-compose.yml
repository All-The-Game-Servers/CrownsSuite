# Deploy this on remote machines to connect them to your ATGS panel.
# Edit the environment variables, then: docker compose up -d --build
services:
  agent:
    build: .
    container_name: atgs-agent
    restart: unless-stopped
    environment:
      - PANEL_URL=ws://YOUR_PANEL_IP:8080
      - NODE_SECRET=your-shared-secret
      - NODE_NAME=node-2
      - DATA_DIR=/data
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
