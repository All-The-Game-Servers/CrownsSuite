services:
  panel:
    build: ./panel
    container_name: atgs-panel
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-8080}:8080"
    environment:
      - PORT=8080
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-atgs}
      - DATA_DIR=/data
      - INSTANCES_DIR=/data/instances
      - EGGS_DIR=/eggs
      - DB_DIR=/data/db
      - MODULES_DIR=/modules
      - RUNNER_IMAGE=atgs-runner:latest
      - NETWORK_NAME=atgs-network
      # HOST_DATA_DIR is auto-detected. Only set this if auto-detection
      # fails (you'll see a warning in docker compose logs).
      # On Windows: C:\Users\you\path\to\atgs\data
      # On Linux: /home/you/path/to/atgs/data
      #- HOST_DATA_DIR=${HOST_DATA_DIR:-}
    volumes:
      - ./data:/data
      - ./eggs:/eggs:ro
      - ./modules:/modules:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - atgs-network

networks:
  atgs-network:
    name: atgs-network
