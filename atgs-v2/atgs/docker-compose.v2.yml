services:
  runner-base:
    build: ./runner
    image: atgs-runner:latest
    profiles: ["build"]
    command: ["sh", "-c", "echo runner image built"]

  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.1.2
    container_name: atgs-socket-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 1
      DELETE: 1
      AUTH: 0
      BUILD: 0
      COMMIT: 0
      CONFIGS: 0
      DISTRIBUTION: 0
      EVENTS: 0
      EXEC: 0
      NODES: 0
      PLUGINS: 0
      SECRETS: 0
      SERVICES: 0
      SESSION: 0
      SWARM: 0
      SYSTEM: 0
      TASKS: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_net
    read_only: true
    tmpfs:
      - /run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  authelia:
    build: ./security/authelia
    container_name: atgs-authelia
    restart: unless-stopped
    profiles: ["auth"]
    environment:
      TZ: ${TZ:-America/New_York}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-panel.example.com}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.example.com}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-example.com}
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/atgs/authelia-session-secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/atgs/authelia-storage-key
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/atgs/authelia-jwt-secret
    volumes:
      - ./security/authelia/users_database.yml:/config/users_database.yml:ro
      - ./data/control/authelia:/var/lib/authelia
      - ./data/control/secrets:/run/secrets/atgs:ro
    networks:
      - edge_net
      - control_net
    read_only: true
    tmpfs:
      - /app
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  panel:
    build: ./panel
    container_name: atgs-panel
    restart: unless-stopped
    user: "${ATGS_UID:-1000}:${ATGS_GID:-1000}"
    depends_on:
      - agent
    environment:
      PORT: 8080
      ADMIN_PASS_FILE: /run/secrets/atgs/panel-admin-password
      DATA_DIR: /data
      CONTROL_DIR: /data/control
      INSTANCES_DIR: /data/instances
      IMPORTS_DIR: /data/imports
      DB_PATH: /data/control/atgs.db
      AGENT_BASE_URL: http://agent:9393
      AGENT_SECRET_FILE: /run/secrets/atgs/agent-secret
      GATEWAY_SECRET_FILE: /run/secrets/atgs/gateway-secret
      PANEL_PROXY_SECRET_FILE: /run/secrets/atgs/panel-proxy-secret
      PANEL_DIRECT_PUBLISH: ${PANEL_DIRECT_PUBLISH:-false}
      PANEL_TRUST_PROXY: ${PANEL_TRUST_PROXY:-true}
      AUTH_PROXY_ENABLED: ${AUTH_PROXY_ENABLED:-true}
      SOCKET_PROXY_ENABLED: ${SOCKET_PROXY_ENABLED:-true}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-panel.example.com}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.example.com}
      RCON_HOST: atgs-minecraft
      RCON_ENABLED: ${RCON_ENABLED:-true}
      SERVER_NAME: ${SERVER_NAME:-ATGS Survival}
      SERVER_FLAVOR: ${SERVER_FLAVOR:-purpur}
      SERVER_VERSION: ${SERVER_VERSION:-latest}
      PERF_PROFILE: ${PERF_PROFILE:-balanced}
      MIN_RAM: ${MIN_RAM:-2G}
      MAX_RAM: ${MAX_RAM:-6G}
      IDLE_GRACE_SECONDS: ${IDLE_GRACE_SECONDS:-900}
      SERVER_MOTD: ${SERVER_MOTD:-ATGS Worldwide}
      MAX_PLAYERS: ${MAX_PLAYERS:-50}
      VIEW_DISTANCE: ${VIEW_DISTANCE:-8}
      SIMULATION_DISTANCE: ${SIMULATION_DISTANCE:-6}
      ONLINE_MODE: ${ONLINE_MODE:-true}
      WHITELIST_ENABLED: ${WHITELIST_ENABLED:-false}
      GEYSER_ENABLED: ${GEYSER_ENABLED:-false}
      BEDROCK_PORT: ${BEDROCK_PORT:-19132}
      RCON_PORT: ${RCON_PORT:-25575}
      RCON_PASSWORD_FILE: /run/secrets/atgs/rcon-password
      JAVA_EXTRA_FLAGS: ${JAVA_EXTRA_FLAGS:-}
    volumes:
      - ./data:/data
      - ./data/control/secrets:/run/secrets/atgs:ro
    networks:
      - control_net
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  agent:
    build: ./agent
    container_name: atgs-agent
    restart: unless-stopped
    user: "${ATGS_UID:-1000}:${ATGS_GID:-1000}"
    depends_on:
      - socket-proxy
    environment:
      PORT: 9393
      AGENT_SECRET_FILE: /run/secrets/atgs/agent-secret
      DATA_DIR: /data
      EGGS_DIR: /eggs
      DOCKER_HOST: tcp://socket-proxy:2375
      NETWORK_NAME: atgs-runtime
      RUNNER_IMAGE: atgs-runner:latest
      RUNTIME_CONTAINER_NAME: atgs-minecraft
      MAIN_INSTANCE_ID: main
      RCON_HOST: atgs-minecraft
      RCON_ENABLED: ${RCON_ENABLED:-true}
      RCON_PASSWORD_FILE: /run/secrets/atgs/rcon-password
    volumes:
      - ./data:/data
      - ./eggs:/eggs:ro
      - ./data/control/secrets:/run/secrets/atgs:ro
    networks:
      - control_net
      - docker_net
      - runtime_net
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  gateway:
    build: ./gateway
    container_name: atgs-gateway
    restart: unless-stopped
    user: "${ATGS_UID:-1000}:${ATGS_GID:-1000}"
    depends_on:
      - panel
    ports:
      - "${GATEWAY_PORT:-25577}:25577"
    environment:
      PANEL_BASE_URL: http://panel:8080
      GATEWAY_SHARED_SECRET_FILE: /run/secrets/atgs/gateway-secret
      GATEWAY_PORT: ${GATEWAY_PORT:-25577}
      GATEWAY_MOTD: ${SERVER_MOTD:-ATGS Worldwide}
      MAX_PLAYERS: ${MAX_PLAYERS:-50}
      BACKEND_ADDRESS: atgs-minecraft:25565
      FORWARDING_SECRET_FILE: /run/secrets/atgs/forwarding-secret
      VELOCITY_HOME: /data/gateway
      WAKE_POLL_MS: 2000
      WAKE_TIMEOUT_MS: 45000
    volumes:
      - ./data/control/gateway:/data/gateway
      - ./data/control/secrets:/run/secrets/atgs:ro
    networks:
      - edge_net
      - control_net
      - runtime_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  caddy:
    build: ./caddy
    container_name: atgs-caddy
    restart: unless-stopped
    depends_on:
      - panel
    ports:
      - "80:80"
      - "443:443"
    environment:
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-panel.example.com}
      AUTH_DOMAIN: ${AUTH_DOMAIN:-auth.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
      AUTH_PROXY_ENABLED: ${AUTH_PROXY_ENABLED:-true}
    volumes:
      - ./data/control/secrets:/run/secrets/atgs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge_net
      - control_net
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  caddy-data:
  caddy-config:

networks:
  edge_net:
    name: atgs-edge
  control_net:
    name: atgs-control
    internal: true
  docker_net:
    name: atgs-docker
    internal: true
  runtime_net:
    name: atgs-runtime
    internal: true
